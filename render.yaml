databases:
  - name: aetheria-db
    databaseName: aetheria
    user: aetheria
    plan: free

services:
  - type: web
    name: code-alpha-aetheria
    env: python
    plan: free
    rootDir: socialmedia
    buildCommand: "./build.sh"
    startCommand: "gunicorn socialmedia.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aetheria-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: "False"
