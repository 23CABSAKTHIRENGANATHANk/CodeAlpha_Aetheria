services:
  - type: redis
    name: aetheria-redis
    plan: free
    ipAllowList: []

  - type: web
    name: code-alpha-aetheria
    env: python
    plan: free
    rootDir: socialmedia
    buildCommand: |
      echo "🔍 Starting build process..." && \
      echo "Installing dependencies..." && \
      pip install --upgrade pip setuptools wheel && \
      pip install -r requirements.txt && \
      echo "Running migrations..." && \
      python manage.py migrate --noinput || echo "⚠️  Initial migration may have failed, will retry on startup" && \
      echo "Collecting static files..." && \
      python manage.py collectstatic --noinput --clear && \
      echo "✅ Build complete"
    startCommand: |
      echo "Starting Django..." && \
      python manage.py migrate --noinput && \
      gunicorn socialmedia.asgi:application \
        -k uvicorn.workers.UvicornWorker \
        -b 0.0.0.0:$PORT \
        -w 4 \
        --timeout 120 \
        --access-logfile - \
        --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_pnB1ravFfS2z@ep-crimson-frog-aqzu1lox-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: REDIS_URL
        fromService:
          type: redis
          name: aetheria-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "code-alpha-aetheria.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://code-alpha-aetheria.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

