databases:
  - name: aetheria-db
    databaseName: aetheria
    user: aetheria
    plan: free

services:
  - type: redis
    name: aetheria-redis
    plan: free
    ipAllowList: []

  - type: web
    name: code-alpha-aetheria
    env: python
    plan: free
    rootDir: socialmedia
    buildCommand: "./build.sh"
    startCommand: "gunicorn socialmedia.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aetheria-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aetheria-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "code-alpha-aetheria.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://code-alpha-aetheria.onrender.com"
