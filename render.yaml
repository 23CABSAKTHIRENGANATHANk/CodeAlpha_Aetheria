services:
  - type: redis
    name: aetheria-redis
    plan: free
    ipAllowList: []

  - type: web
    name: code-alpha-aetheria
    env: python
    plan: free
    rootDir: socialmedia
    buildCommand: |
      set -e && \
      echo "=== Aetheria Build Start ===" && \
      echo "Python version:" && python --version && \
      echo "Upgrading pip..." && \
      pip install --upgrade pip setuptools wheel && \
      echo "Installing dependencies..." && \
      pip install -r requirements.txt && \
      echo "Running Django checks..." && \
      python manage.py check && \
      echo "Running migrations..." && \
      python manage.py migrate --noinput && \
      echo "Collecting static files..." && \
      python manage.py collectstatic --noinput --clear && \
      echo "=== Aetheria Build Complete ===" && \
      echo "✅ Build successful"
    startCommand: |
      python manage.py migrate --noinput && \
      gunicorn socialmedia.asgi:application \
        -k uvicorn.workers.UvicornWorker \
        -b 0.0.0.0:$PORT \
        -w 4 \
        --timeout 120 \
        --access-logfile - \
        --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: aetheria-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "code-alpha-aetheria.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://code-alpha-aetheria.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

