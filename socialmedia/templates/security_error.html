{% extends "base.html" %}
{% load static %}

{% block title %}Error - Aetheria{% endblock %}

{% block content %}
<div class="error-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px;">
    <div style="text-align: center; max-width: 500px;">
        <i class="fas fa-exclamation-triangle" style="font-size: 64px; color: var(--accent-3); margin-bottom: 20px;"></i>
        <h1 style="font-size: 28px; margin-bottom: 10px;">{{ error_title }}</h1>
        <p style="font-size: 16px; color: var(--text-secondary); margin-bottom: 20px;">{{ error_message }}</p>
        
        {% if reason %}
        <p style="font-size: 14px; color: var(--text-muted); background: var(--bg-tertiary); padding: 12px; border-radius: 8px; margin-bottom: 20px;">
            {{ reason }}
        </p>
        {% endif %}
        
        <div style="display: flex; gap: 12px; justify-content: center;">
            <a href="{% url 'landing' %}" class="btn btn-primary" style="padding: 10px 20px; text-decoration: none; border-radius: 8px; background: var(--accent); color: white;">Go Home</a>
            <button onclick="window.history.back()" class="btn btn-secondary" style="padding: 10px 20px; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 8px; cursor: pointer;">Go Back</button>
        </div>
    </div>
</div>
{% endblock %}
