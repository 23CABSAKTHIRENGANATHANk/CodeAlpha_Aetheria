{% extends "base.html" %}
{% load static %}

{% block title %}Page Not Found - Aetheria{% endblock %}

{% block content %}
<div class="error-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px;">
    <div style="text-align: center; max-width: 500px;">
        <h1 style="font-size: 64px; color: var(--accent); margin-bottom: 20px; font-weight: 900;">404</h1>
        <h2 style="font-size: 28px; margin-bottom: 10px;">Page Not Found</h2>
        <p style="font-size: 16px; color: var(--text-secondary); margin-bottom: 30px;">The page you're looking for doesn't exist or has been moved.</p>
        
        <div style="display: flex; gap: 12px; justify-content: center;">
            <a href="{% url 'feed' %}" class="btn btn-primary" style="padding: 10px 20px; text-decoration: none; border-radius: 8px; background: var(--accent); color: white;">Go to Feed</a>
            <a href="{% url 'landing' %}" class="btn btn-secondary" style="padding: 10px 20px; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 8px; text-decoration: none;">Go Home</a>
        </div>
    </div>
</div>
{% endblock %}
